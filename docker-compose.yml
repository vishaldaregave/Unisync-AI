# UniSync AI — local infrastructure.
#
# Scope for M1a Phase 0: PostgreSQL (with pgvector) and Redis only.
# The API and web app run on the host during development so that reloads,
# debuggers and test runners behave normally. Containerised api/worker/beat
# images belong to the deployment phase (v2 §3.10).
#
# NOTE: verified on 2026-11-16 — both services reach `healthy`, pgvector 0.8.7
# is installed, and the owner/app roles are provisioned by the init script.
# See docs/implementation-log.md (Phase 1.1).

name: unisync

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: unisync-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unisync}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # Consumed by docker/postgres/init/01-bootstrap.sh to provision the two
      # roles required by v2 §13.5-E1.1 (owner vs runtime).
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-unisync_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-local-owner-placeholder}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-unisync_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local-app-placeholder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-unisync}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: unisync-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

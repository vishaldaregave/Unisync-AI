# UniSync AI — local infrastructure.
#
# Scope for M1a Phase 0: PostgreSQL (with pgvector) and Redis only.
# The API and web app run on the host during development so that reloads,
# debuggers and test runners behave normally. Containerised api/worker/beat
# images belong to the deployment phase (v2 §3.10).
#
# NOTE: this file is authored but UNVERIFIED on the current machine —
# Docker is not installed (see docs/implementation-log.md).

name: unisync

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: unisync-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unisync}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-unisync}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: unisync-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
